[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "iptv-check"
version = "4.1.0"
description = "电视直播源检测工具"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "aiohttp>=3.9",
    "aiohttp-retry>=2.8",
    "tenacity>=8.0",
    "aiocache>=0.12",
    "pybreaker>=1.3",
    "blinker>=1.6",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "diskcache>=5.6",
    "transitions>=0.9",
    "ffmpeg-python>=0.2",
    "aioresponses>=0.7",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19",
    "pycountry>=23.12",
]

[project.optional-dependencies]
desktop = ["ttkbootstrap>=1.5"]
excel = ["openpyxl>=3.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[project.scripts]
iptv-check = "iptv_check.server.main:main"

[tool.setuptools.packages.find]
include = ["iptv_check*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
