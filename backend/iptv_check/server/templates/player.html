 <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{ channel_name }} - IPTV Player</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans SC','Inter',sans-serif;background:#f5f7fa;color:#1a1a1a}

.player-container{
  width:100%;height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f0f4ff 0%,#e8edf5 40%,#f5f7fa 100%);
  position:relative;
}

.loading-screen{
  position:absolute;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f0f4ff 0%,#e8edf5 40%,#f5f7fa 100%);
  transition:opacity .4s ease;
}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-ring{
  width:40px;height:40px;border:3px solid rgba(0,0,0,0.08);
  border-top-color:#6366f1;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:13px;color:#999;letter-spacing:0.02em}
.load-error{text-align:center}
.load-error-icon{font-size:40px;margin-bottom:8px}
.load-error-title{font-size:15px;font-weight:600;color:#e74c3c;margin-bottom:4px}
.load-error-desc{font-size:12px;color:#999;margin-bottom:12px}
.load-error-retry{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;
  padding:6px 20px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;
}

.top-bar{
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;
  background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,0.06);
}
.top-bar button{
  background:none;border:none;color:#666;cursor:pointer;
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.top-bar button:hover{background:rgba(0,0,0,0.06);color:#1a1a1a}
.top-bar button svg{width:18px;height:18px}
.top-bar .channel-name{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  padding:2px 10px;border-radius:6px;font-size:10px;font-weight:600;
  letter-spacing:0.03em;flex-shrink:0;
}
.spacer{flex:1}

.top-bar details{position:relative}
.top-bar details summary{
  padding:4px 8px;cursor:pointer;font-size:11px;color:#666;
  list-style:none;border-radius:6px;
}
.top-bar details summary:hover{background:rgba(0,0,0,0.06);color:#1a1a1a}
.top-bar details[open]{
  position:absolute;top:40px;right:0;
  background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);
  border-radius:10px;padding:12px 16px;min-width:180px;z-index:20;
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 8px 32px rgba(0,0,0,0.1);
}
.top-bar details[open] summary{display:none}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:11px}
.info-label{color:#666}
.info-value{color:#444}

.video-area{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#eef2f7}
.video-area video{width:100%;height:100%}

.radio-view{
  display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;position:relative;overflow:hidden;
}
.radio-view::before{
  content:'';position:absolute;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.disc{
  width:160px;height:160px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;position:relative;
  box-shadow:0 4px 40px rgba(0,0,0,0.1);
}
.disc::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(0,0,0,0.04);pointer-events:none;
}
.disc-inner{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:700;color:#fff;position:relative;
}
.disc-inner.playing{animation:discSpin 12s linear infinite}
@keyframes discSpin{to{transform:rotate(360deg)}}
.disc-hole{
  position:absolute;top:50%;left:50%;width:22px;height:22px;border-radius:50%;
  background:#f5f7fa;transform:translate(-50%,-50%);z-index:2;
  border:2px solid rgba(0,0,0,0.06);
  box-shadow:inset 0 0 6px rgba(0,0,0,0.1);
}
.radio-name{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:6px;letter-spacing:-0.01em}
.radio-frequency{display:none;font-size:32px;font-weight:800;color:#6366f1;margin-bottom:4px;letter-spacing:0.02em}
.radio-frequency .unit{font-size:16px;font-weight:600;color:#8b5cf6;margin-left:4px}
.radio-frequency .hint{display:block;font-size:11px;font-weight:400;color:#888;letter-spacing:0;margin-top:2px}
.radio-status{font-size:13px;color:#888;margin-bottom:24px}
.radio-status .green{color:#16a34a}

.radio-controls{
  display:flex;align-items:center;gap:16px;
  padding:10px 24px;border-radius:12px;
  background:rgba(255,255,255,0.8);
  border:1px solid rgba(0,0,0,0.08);
}
.radio-controls button{
  background:none;border:none;color:#666;cursor:pointer;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.radio-controls button:hover{background:rgba(0,0,0,0.06);color:#1a1a1a}
.radio-controls button.play-btn{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;width:44px;height:44px;
  box-shadow:0 4px 16px rgba(99,102,241,0.3);
}
.radio-controls button.play-btn:hover{box-shadow:0 4px 24px rgba(99,102,241,0.45)}
.radio-controls .time-text{font-size:12px;color:#666;min-width:40px}
.radio-controls .vol-slider{
  -webkit-appearance:none;appearance:none;width:80px;height:4px;
  background:rgba(0,0,0,0.12);border-radius:2px;outline:none;
}
.radio-controls .vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:12px;height:12px;
  background:#6366f1;border-radius:50%;cursor:pointer;
}

.radio-info{
  margin-top:28px;padding:16px 20px;border-radius:12px;
  background:rgba(255,255,255,0.8);border:1px solid rgba(0,0,0,0.08);
  text-align:left;max-width:420px;width:100%;
}
.radio-info-title{font-size:12px;font-weight:600;color:#888;margin-bottom:8px;letter-spacing:0.04em;text-transform:uppercase}
.radio-info-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12px;line-height:1.5}
.radio-info-row .label{color:#888;flex-shrink:0;min-width:48px}
.radio-info-row .value{color:#333;word-break:break-all;flex:1;user-select:all;cursor:text}
.radio-info-row .copy-btn{
  flex-shrink:0;background:none;border:1px solid rgba(0,0,0,0.12);color:#666;
  padding:2px 8px;border-radius:4px;font-size:10px;cursor:pointer;
  transition:all .15s;
}
.radio-info-row .copy-btn:hover{border-color:#6366f1;color:#6366f1}
.radio-info-row .copy-btn.copied{border-color:#16a34a;color:#16a34a}

.fallback{
  display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:30;
}
.fallback p{color:#666;font-size:14px;margin-bottom:16px}
.fallback button{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;
  padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  box-shadow:0 4px 16px rgba(99,102,241,0.3);
}
</style>
</head>
<body>
<div class="player-container">
  <div class="loading-screen" id="loading-screen">
    <div class="loading-ring" id="loading-ring"></div>
    <div class="loading-text" id="loading-text">加载播放器...</div>
    <div class="load-error" id="load-error" style="display:none">
      <div class="load-error-icon">⚠️</div>
      <div class="load-error-title">源服务器不可达</div>
      <div class="load-error-desc">该频道源已失效或网络不通，请尝试其他频道</div>
      <button class="load-error-retry" onclick="document.getElementById('load-error').style.display='none';document.getElementById('loading-ring').style.display='block';document.getElementById('loading-text').style.display='block';retryPlay()">重试</button>
    </div>
  </div>

  <div class="top-bar">
    <button onclick="history.back()" title="返回">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <span class="badge" id="region-badge" style="display:none;background:rgba(99,102,241,0.12);color:#6366f1;font-size:11px"></span>
    <span class="channel-name">{{ channel_name }}</span>
    <span class="badge" id="type-badge" style="background:rgba(231,76,60,0.12);color:#e74c3c">电台</span>
    <div class="spacer"></div>
    <details id="stream-info">
      <summary>⏱</summary>
      <div class="info-row"><span class="info-label">码率</span><span class="info-value" id="info-bitrate">-</span></div>
      <div class="info-row"><span class="info-label">编码</span><span class="info-value" id="info-codec">-</span></div>
      <div class="info-row"><span class="info-label">缓冲</span><span class="info-value" id="info-buffer">-</span></div>
    </details>
  </div>

  <div class="video-area" id="video-area">
    <video id="tv-video" controls playsinline preload="auto" style="width:100%;height:100%;background:#000"></video>
  </div>

  <div class="radio-view" id="radio-view">
    <div class="disc"><div class="disc-inner" id="disc-inner"><div class="disc-hole"></div></div></div>
    <div class="radio-name">{{ channel_name }}</div>
    <div class="radio-frequency" id="radio-frequency">
      <span id="freq-value"></span><span class="unit" id="freq-unit"></span>
      <span class="hint">调至此频率收听</span>
    </div>
    <div class="radio-status"><span class="green" id="play-status">加载中...</span></div>
    <div class="radio-controls">
      <button id="btn-prev" title="后退10秒">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8.14v7.72L6.28 12 12.5 8.14M14 4l-10 8 10 8V4zm5 0v16h-2V4h2z"/></svg>
      </button>
      <button class="play-btn" id="btn-play" title="播放/暂停">
        <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="btn-next" title="前进10秒">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 15.86V8.14L17.72 12l-6.22 3.86M10 20l10-8-10-8v16zm-5 0h2V4H5v16z"/></svg>
      </button>
      <span class="time-text" id="time-text">0:00</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#888"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="80">
    </div>
    <div class="radio-info" id="radio-info">
      <div class="radio-info-title">电台信息</div>
      <div class="radio-info-row" id="info-region-row" style="display:none">
        <span class="label">地区</span>
        <span class="value" id="info-region">{{ channel_group }}</span>
      </div>
      <div class="radio-info-row">
        <span class="label">名称</span>
        <span class="value" id="info-name">{{ channel_name }}</span>
      </div>
      <div class="radio-info-row" id="info-frequency-row" style="display:none">
        <span class="label">频率</span>
        <span class="value" id="info-frequency">{{ frequency }}</span>
      </div>
      <div class="radio-info-row">
        <span class="label">地址</span>
        <span class="value" id="info-stream-url">{{ stream_url }}</span>
        <button class="copy-btn" onclick="copyText('info-stream-url',this)">复制</button>
      </div>
      <div class="radio-info-row" id="info-proxy-row">
        <span class="label">代理</span>
        <span class="value" id="info-proxy-url">{{ proxy_url }}</span>
        <button class="copy-btn" onclick="copyText('info-proxy-url',this)">复制</button>
      </div>
    </div>
    <audio id="radio-audio" preload="auto" style="display:none"></audio>
  </div>

  <div class="fallback" id="fallback">
    <p>播放器加载失败</p>
    <button onclick="location.reload()">刷新重试</button>
  </div>
</div>

<script src="/static/hls.min.js"></script>
<script>
(function(){
var isRadio = {{ is_radio }} === true || {{ is_radio }} === 'true';
var channelName = '{{ channel_name }}';
var streamUrl = '{{ stream_url }}';
var proxyUrl = '{{ proxy_url }}';
var channelGroup = '{{ channel_group }}';
var frequency = '{{ frequency }}';
var loadingScreen = document.getElementById('loading-screen');
var typeBadge = document.getElementById('type-badge');
var videoArea = document.getElementById('video-area');
var radioView = document.getElementById('radio-view');
var fallback = document.getElementById('fallback');

var regionBadge=document.getElementById('region-badge');
var CN_KW=['央视','卫视','CGTN','CRI','地方','北京','上海','天津','重庆','河北','河南','山东','山西','陕西','湖北','湖南','安徽','浙江','江苏','江西','广东','广西','福建','四川','贵州','云南','辽宁','吉林','黑龙江','内蒙古','新疆','西藏','青海','甘肃','宁夏','海南','香港','澳门','台湾','深圳','广州','杭州','南京','成都','武汉','长沙','苏州'];
var isCN=false;
for(var ci=0;ci<CN_KW.length;ci++){if(channelGroup.indexOf(CN_KW[ci])>=0){isCN=true;break}}
if(channelGroup&&!isCN){
  var shortGroup=channelGroup.split('/').pop();
  regionBadge.textContent=shortGroup;
  regionBadge.style.display='inline';
  var gc={'国际':['rgba(37,99,235,0.12)','#2563eb'],'体育':['rgba(234,88,12,0.12)','#ea580c'],'新闻':['rgba(37,99,235,0.12)','#2563eb'],'音乐':['rgba(236,72,153,0.12)','#ec4899'],'影视':['rgba(139,92,246,0.12)','#8b5cf6'],'少儿':['rgba(34,197,94,0.12)','#22c55e'],'宗教':['rgba(234,88,12,0.12)','#ea580c']};
  for(var k in gc){if(channelGroup.indexOf(k)>=0){regionBadge.style.background=gc[k][0];regionBadge.style.color=gc[k][1];break}}
  var rr=document.getElementById('info-region-row');if(rr){rr.style.display='flex'}
}
if(frequency){var fr=document.getElementById('info-frequency-row');if(fr){fr.style.display='flex'}}

function hideLoading(){loadingScreen.classList.add('hidden')}
function showFallback(){fallback.style.display='block';hideLoading()}
function copyText(id,btn){
  var el=document.getElementById(id);
  var text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text)}
  else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}
  btn.textContent='已复制';btn.classList.add('copied');
  setTimeout(function(){btn.textContent='复制';btn.classList.remove('copied')},1500);
}

var PALETTE=[['#e74c3c','#c0392b'],['#e67e22','#d35400'],['#f1c40f','#f39c12'],['#2ecc71','#27ae60'],['#1abc9c','#16a085'],['#3498db','#2980b9'],['#9b59b6','#8e44ad'],['#e84393','#c2185b'],['#00b894','#00a381'],['#6c5ce7','#5b2ccf']];
function pickPal(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return PALETTE[Math.abs(h)%PALETTE.length]}
function firstLetter(s){if(!s)return'?';var c=s.trim()[0];return /[\u4e00-\u9fff]/.test(c)?c:c.toUpperCase()}

function waitForLib(name,timeout){
  return new Promise(function(resolve){
    if(window[name])return resolve(window[name]);
    var ci=setInterval(function(){if(window[name]){clearInterval(ci);resolve(window[name])}},150);
    setTimeout(function(){clearInterval(ci);resolve(null)},timeout||6000);
  });
}

var validUrl = proxyUrl || streamUrl;
if(!validUrl){showFallback();return}

if(isRadio){
  videoArea.style.display='none';
  radioView.style.display='flex';
  typeBadge.textContent='电台';
  typeBadge.style.background='rgba(231,76,60,0.12)';
  typeBadge.style.color='#e74c3c';
  if(!proxyUrl){document.getElementById('info-proxy-row').style.display='none'}

  var freqEl=document.getElementById('radio-frequency');
  var freqValue=document.getElementById('freq-value');
  var freqUnit=document.getElementById('freq-unit');
  var fmMatch=channelName.match(/(\d+\.?\d*)\s*(FM|AM|kHz|MHz)/i);
  if(fmMatch){
    freqValue.textContent=fmMatch[1];
    freqUnit.textContent=fmMatch[2].toUpperCase();
    freqEl.style.display='block';
  }

  var discInner=document.getElementById('disc-inner');
  var playStatus=document.getElementById('play-status');
  var pal=pickPal(channelName);
  discInner.style.background='linear-gradient(135deg,'+pal[0]+','+pal[1]+')';
  discInner.textContent=firstLetter(channelName);

  var radioAudio=document.getElementById('radio-audio');
  var btnPlay=document.getElementById('btn-play');
  var iconPlay=document.getElementById('icon-play');
  var iconPause=document.getElementById('icon-pause');
  var timeText=document.getElementById('time-text');
  var volSlider=document.getElementById('vol-slider');
  var isPlaying=false;

  function updatePlayUI(playing){
    isPlaying=playing;
    iconPlay.style.display=playing?'none':'block';
    iconPause.style.display=playing?'block':'none';
    if(playing){discInner.classList.add('playing');playStatus.textContent='正在播放';playStatus.classList.add('green')}
    else{discInner.classList.remove('playing');playStatus.textContent='已暂停';playStatus.classList.remove('green')}
  }

  function formatTime(s){var m=Math.floor(s/60);var sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}

  btnPlay.addEventListener('click',function(){if(isPlaying)radioAudio.pause();else radioAudio.play()});
  document.getElementById('btn-prev').addEventListener('click',function(){radioAudio.currentTime=Math.max(0,radioAudio.currentTime-10)});
  document.getElementById('btn-next').addEventListener('click',function(){radioAudio.currentTime=radioAudio.currentTime+10});
  volSlider.addEventListener('input',function(){radioAudio.volume=this.value/100});
  radioAudio.volume=0.8;

  radioAudio.addEventListener('playing',function(){updatePlayUI(true);hideLoading()});
  radioAudio.addEventListener('pause',function(){updatePlayUI(false)});
  radioAudio.addEventListener('timeupdate',function(){timeText.textContent=formatTime(radioAudio.currentTime)});
  radioAudio.addEventListener('error',function(){playStatus.textContent='播放出错';playStatus.classList.remove('green');hideLoading()});

  waitForLib('Hls',6000).then(function(HlsLib){
    if(!HlsLib){radioAudio.src=validUrl;radioAudio.play().catch(function(){});return}
    if(HlsLib.isSupported()){
      var hls=new HlsLib({enableWorker:true,lowLatencyMode:false,manifestLoadingTimeOut:15000,levelLoadingTimeOut:10000});
      hls.loadSource(validUrl);hls.attachMedia(radioAudio);
      hls.on(HlsLib.Events.MANIFEST_PARSED,function(){radioAudio.play().catch(function(){})});
      hls.on(HlsLib.Events.ERROR,function(e,d){if(d.fatal){if(d.type===HlsLib.ErrorTypes.NETWORK_ERROR)hls.startLoad();else if(d.type===HlsLib.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError()}});
      setInterval(function(){if(!hls||hls.currentLevel<0||!hls.levels)return;var l=hls.levels[hls.currentLevel];if(l)document.getElementById('info-bitrate').textContent=Math.round(l.bitrate/1000)+' kbps'},2000);
    }else if(radioAudio.canPlayType('application/vnd.apple.mpegurl')){
      radioAudio.src=validUrl;radioAudio.play().catch(function(){});
    }else{radioAudio.src=validUrl;radioAudio.play().catch(function(){})}
  });
}else{
  radioView.style.display='none';
  videoArea.style.display='flex';
  typeBadge.textContent='电视';
  typeBadge.style.background='rgba(52,152,219,0.12)';
  typeBadge.style.color='#3498db';

  var tvVideo=document.getElementById('tv-video');
  var tvNetErrorCount=0;
  window.retryPlay=function(){
    tvNetErrorCount=0;
    document.getElementById('loading-ring').style.display='block';
    document.getElementById('loading-text').style.display='block';
    if(window._tvHls){
      window._tvHls.startLoad();
    }else if(tvVideo.src){
      tvVideo.load();tvVideo.play().catch(function(){});
    }
  };
  waitForLib('Hls',8000).then(function(HlsLib){
    if(!HlsLib||!HlsLib.isSupported()){
      if(tvVideo.canPlayType('application/vnd.apple.mpegurl')){tvVideo.src=validUrl;tvVideo.play().catch(function(){})}
      else{tvVideo.src=validUrl;tvVideo.play().catch(function(){})}
      hideLoading();return;
    }
    var hls=new HlsLib({enableWorker:true,lowLatencyMode:false,manifestLoadingTimeOut:15000,levelLoadingTimeOut:10000});
    window._tvHls=hls;
    hls.loadSource(validUrl);hls.attachMedia(tvVideo);
    hls.on(HlsLib.Events.MANIFEST_PARSED,function(){tvNetErrorCount=0;tvVideo.play().catch(function(){})});
    hls.on(HlsLib.Events.ERROR,function(e,d){
      if(d.fatal){
        if(d.type===HlsLib.ErrorTypes.NETWORK_ERROR){
          tvNetErrorCount++;
          if(tvNetErrorCount>=3){
            hideLoading();
            document.getElementById('load-error').style.display='block';
            document.getElementById('loading-ring').style.display='none';
            document.getElementById('loading-text').style.display='none';
            return;
          }
          hls.startLoad();
        }else if(d.type===HlsLib.ErrorTypes.MEDIA_ERROR){
          hls.recoverMediaError();
        }
      }
    });
    tvVideo.addEventListener('playing',function(){tvNetErrorCount=0;hideLoading()});
    setTimeout(function(){if(tvNetErrorCount===0)hideLoading()},4000);
  });
}
})();
</script>
</body>
</html>
