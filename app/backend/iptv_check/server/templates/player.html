 <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{ channel_name }} - IPTV Player</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans SC','Inter',sans-serif;background:#000;color:#f2f2f2}

.player-container{
  width:100%;height:100vh;display:flex;flex-direction:column;
  background:#000;
  position:relative;
}

.loading-screen{
  position:absolute;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;
  transition:opacity .4s ease;
}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-ring{
  width:40px;height:40px;border:3px solid rgba(255,255,255,0.15);
  border-top-color:#6366f1;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:13px;color:rgba(255,255,255,0.6);letter-spacing:0.02em}
.load-error{text-align:center}
.load-error-icon{font-size:40px;margin-bottom:8px}
.load-error-title{font-size:15px;font-weight:600;color:#e74c3c;margin-bottom:4px}
.load-error-desc{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:12px}
.load-error-retry{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;
  padding:6px 20px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;
}

.top-bar{
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.1);
  position:relative;
}
.top-bar button{
  background:none;border:none;color:rgba(255,255,255,0.75);cursor:pointer;
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.top-bar button:hover{background:rgba(255,255,255,0.12);color:#fff}
.top-bar button svg{width:18px;height:18px}
.top-bar .channel-name{font-size:14px;font-weight:600;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  padding:2px 10px;border-radius:6px;font-size:10px;font-weight:600;
  letter-spacing:0.03em;flex-shrink:0;
}
.spacer{flex:1}
.source-selector{display:none;padding:3px 8px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:12px;color:rgba(255,255,255,0.9);cursor:pointer;max-width:180px;flex-shrink:0;background:rgba(30,30,30,0.9);outline:none}
.source-selector.visible{display:block}
.source-selector option{font-size:12px}

.top-bar .stream-info-panel{
  display:none;position:absolute;top:calc(100% + 6px);right:12px;
  background:rgba(20,20,20,0.95);backdrop-filter:blur(16px);
  border-radius:10px;padding:14px 20px;min-width:220px;z-index:20;
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.top-bar .stream-info-panel.show{display:block}
.top-bar #stream-info-btn.active{background:rgba(255,255,255,0.12);color:#fff}
.top-bar #epg-btn.active{background:rgba(255,255,255,0.12);color:#fff}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13px;font-weight:500}
.info-label{color:rgba(255,255,255,0.7);font-weight:600}
.info-value{color:#fff;font-weight:500}

.epg-panel{
  display:none;position:absolute;top:0;right:0;bottom:0;width:360px;max-width:85vw;z-index:40;
  background:rgba(16,16,18,0.96);backdrop-filter:blur(16px);
  border-left:1px solid rgba(255,255,255,0.1);
  box-shadow:-8px 0 32px rgba(0,0,0,0.5);
  flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;
}
.epg-panel.open{display:flex;transform:translateX(0)}
.epg-panel-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.1);flex-shrink:0}
.epg-panel-title{font-size:14px;font-weight:600;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epg-panel-close{background:none;border:none;color:rgba(255,255,255,0.75);cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.epg-panel-close:hover{background:rgba(255,255,255,0.12);color:#fff}
.epg-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.epg-msg{color:rgba(255,255,255,0.6);font-size:13px;text-align:center;padding:40px 16px}
.epg-loading{display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,0.6);font-size:13px;padding:40px 0}
.epg-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.15);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
.epg-now{flex-shrink:0;border:1px solid rgba(99,102,241,0.4);background:rgba(99,102,241,0.1);border-radius:10px;padding:10px 12px;margin-bottom:4px}
.epg-now-label{font-size:11px;color:#818cf8;font-weight:600;margin-bottom:4px}
.epg-now-title{font-size:14px;font-weight:600;color:#fff}
.epg-now-desc{font-size:12px;color:rgba(255,255,255,0.6);margin-top:4px;line-height:1.5}
.epg-item{border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 12px;flex-shrink:0}
.epg-item.current{border-color:rgba(99,102,241,0.45);background:rgba(99,102,241,0.08)}
.epg-item-time{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,0.55);flex-wrap:wrap}
.epg-item-cat{background:rgba(255,255,255,0.08);border-radius:4px;padding:1px 6px;font-size:10px;color:rgba(255,255,255,0.6)}
.epg-item-current-badge{background:rgba(99,102,241,0.25);color:#a5b4fc;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600}
.epg-item-title{font-size:13px;font-weight:500;color:#fff;margin-top:4px}
.epg-item-desc{font-size:11px;color:rgba(255,255,255,0.55);margin-top:2px;line-height:1.4}

.video-area{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.video-area video{width:100%;height:100%}
.video-area video::-webkit-media-controls-enclosure{transition:opacity .25s ease}
.video-area video.controls-hidden::-webkit-media-controls-enclosure{opacity:0;pointer-events:none}

.radio-view{
  display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;position:relative;overflow:hidden;
}
.radio-view::before{
  content:'';position:absolute;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.disc{
  width:160px;height:160px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;position:relative;
  box-shadow:0 4px 40px rgba(0,0,0,0.1);
}
.disc::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.12);pointer-events:none;
}
.disc-inner{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:700;color:#fff;position:relative;
}
.disc-inner.playing{animation:discSpin 12s linear infinite}
@keyframes discSpin{to{transform:rotate(360deg)}}
.disc-hole{
  position:absolute;top:50%;left:50%;width:22px;height:22px;border-radius:50%;
  background:#111;transform:translate(-50%,-50%);z-index:2;
  border:2px solid rgba(255,255,255,0.15);
  box-shadow:inset 0 0 6px rgba(0,0,0,0.6);
}
.radio-name{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;letter-spacing:-0.01em}
.radio-frequency{display:none;font-size:32px;font-weight:800;color:#6366f1;margin-bottom:4px;letter-spacing:0.02em}
.radio-frequency .unit{font-size:16px;font-weight:600;color:#8b5cf6;margin-left:4px}
.radio-frequency .hint{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,0.55);letter-spacing:0;margin-top:2px}
.radio-status{font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:24px}
.radio-status .green{color:#16a34a}

.radio-controls{
  display:flex;align-items:center;gap:16px;
  padding:10px 24px;border-radius:12px;
  background:rgba(30,30,30,0.85);
  border:1px solid rgba(255,255,255,0.12);
}
.radio-controls button{
  background:none;border:none;color:rgba(255,255,255,0.75);cursor:pointer;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.radio-controls button:hover{background:rgba(255,255,255,0.12);color:#fff}
.radio-controls button.play-btn{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;width:44px;height:44px;
  box-shadow:0 4px 16px rgba(99,102,241,0.3);
}
.radio-controls button.play-btn:hover{box-shadow:0 4px 24px rgba(99,102,241,0.45)}
.radio-controls .time-text{font-size:12px;color:rgba(255,255,255,0.7);min-width:40px}
.radio-controls .vol-slider{
  -webkit-appearance:none;appearance:none;width:80px;height:4px;
  background:rgba(255,255,255,0.25);border-radius:2px;outline:none;
}
.radio-controls .vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:12px;height:12px;
  background:#6366f1;border-radius:50%;cursor:pointer;
}

.radio-info{
  margin-top:28px;padding:16px 20px;border-radius:12px;
  background:rgba(30,30,30,0.85);border:1px solid rgba(255,255,255,0.12);
  text-align:left;max-width:420px;width:100%;
}
.radio-info-title{font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:8px;letter-spacing:0.04em;text-transform:uppercase}
.radio-info-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12px;line-height:1.5}
.radio-info-row .label{color:rgba(255,255,255,0.55);flex-shrink:0;min-width:48px}
.radio-info-row .value{color:rgba(255,255,255,0.9);word-break:break-all;flex:1;user-select:all;cursor:text}
.radio-info-row .copy-btn{
  flex-shrink:0;background:none;border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);
  padding:2px 8px;border-radius:4px;font-size:10px;cursor:pointer;
  transition:all .15s;
}
.radio-info-row .copy-btn:hover{border-color:#6366f1;color:#6366f1}
.radio-info-row .copy-btn.copied{border-color:#16a34a;color:#16a34a}

.fallback{
  display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:30;
}
.fallback p{color:rgba(255,255,255,0.7);font-size:14px;margin-bottom:16px}
.fallback button{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;
  padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  box-shadow:0 4px 16px rgba(99,102,241,0.3);
}
</style>
</head>
<body>
<div class="player-container">
  <div class="loading-screen" id="loading-screen">
    <div class="loading-ring" id="loading-ring"></div>
    <div class="loading-text" id="loading-text">加载播放器...</div>
    <div class="load-error" id="load-error" style="display:none">
      <div class="load-error-icon">⚠️</div>
      <div class="load-error-title">源服务器不可达</div>
      <div class="load-error-desc">该频道源已失效或网络不通，请尝试其他频道</div>
      <button class="load-error-retry" onclick="document.getElementById('load-error').style.display='none';document.getElementById('loading-ring').style.display='block';document.getElementById('loading-text').style.display='block';retryPlay()">重试</button>
    </div>
  </div>

  <div class="top-bar">
    <button onclick="history.back()" title="返回">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <span class="badge" id="region-badge" style="display:none;background:rgba(99,102,241,0.12);color:#6366f1;font-size:11px"></span>
    <span class="channel-name">{{ channel_name }}</span>
    <select id="source-selector" class="source-selector {{ source_selector_class }}" onchange="switchSource(this.value)"></select>
    <span class="badge" id="type-badge" style="background:rgba(231,76,60,0.12);color:#e74c3c">电台</span>
    <div class="spacer"></div>
    <button id="epg-btn" class="epg-btn" title="节目单" aria-label="节目单">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
    </button>
    <button id="stream-info-btn" title="流信息" aria-label="流信息">⏱</button>
    <div class="stream-info-panel" id="stream-info-panel">
      <div class="info-row"><span class="info-label">码率</span><span class="info-value" id="info-bitrate">-</span></div>
      <div class="info-row"><span class="info-label">编码</span><span class="info-value" id="info-codec">-</span></div>
      <div class="info-row"><span class="info-label">缓冲</span><span class="info-value" id="info-buffer">-</span></div>
    </div>
  </div>

  <div class="video-area" id="video-area">
    <video id="tv-video" controls playsinline preload="auto" autoplay muted style="width:100%;height:100%;background:#000"></video>
    <div id="unmute-hint" style="display:none;position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,0.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;align-items:center;gap:6px;transition:opacity .3s" onclick="var v=document.getElementById('tv-video');v.muted=false;v.volume=1;this.style.display='none'">&#x1f50a; 点击开启声音</div>
  </div>

  <div class="radio-view" id="radio-view">
    <div class="disc"><div class="disc-inner" id="disc-inner"><div class="disc-hole"></div></div></div>
    <div class="radio-name">{{ channel_name }}</div>
    <div class="radio-frequency" id="radio-frequency">
      <span id="freq-value"></span><span class="unit" id="freq-unit"></span>
      <span class="hint">调至此频率收听</span>
    </div>
    <div class="radio-status"><span class="green" id="play-status">加载中...</span></div>
    <button id="radio-retry" style="display:none;margin-bottom:16px;padding:6px 16px;border-radius:20px;border:1px solid rgba(231,76,60,0.4);background:rgba(231,76,60,0.08);color:#e74c3c;font-size:13px;cursor:pointer" onclick="retryRadio()">🔄 重试播放</button>
    <div class="radio-controls">
      <button id="btn-prev" title="后退10秒">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8.14v7.72L6.28 12 12.5 8.14M14 4l-10 8 10 8V4zm5 0v16h-2V4h2z"/></svg>
      </button>
      <button class="play-btn" id="btn-play" title="播放/暂停">
        <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="btn-next" title="前进10秒">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 15.86V8.14L17.72 12l-6.22 3.86M10 20l10-8-10-8v16zm-5 0h2V4H5v16z"/></svg>
      </button>
      <span class="time-text" id="time-text">0:00</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="rgba(255,255,255,0.75)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="80">
    </div>
    <div class="radio-info" id="radio-info">
      <div class="radio-info-title">电台信息</div>
      <div class="radio-info-row" id="info-region-row" style="display:none">
        <span class="label">地区</span>
        <span class="value" id="info-region">{{ channel_group }}</span>
      </div>
      <div class="radio-info-row">
        <span class="label">名称</span>
        <span class="value" id="info-name">{{ channel_name }}</span>
      </div>
      <div class="radio-info-row" id="info-frequency-row" style="display:none">
        <span class="label">频率</span>
        <span class="value" id="info-frequency">{{ frequency }}</span>
      </div>
      <div class="radio-info-row">
        <span class="label">地址</span>
        <span class="value" id="info-stream-url">{{ stream_url }}</span>
        <button class="copy-btn" onclick="copyText('info-stream-url',this)">复制</button>
      </div>
      <div class="radio-info-row" id="info-proxy-row">
        <span class="label">代理</span>
        <span class="value" id="info-proxy-url">{{ proxy_url }}</span>
        <button class="copy-btn" onclick="copyText('info-proxy-url',this)">复制</button>
      </div>
    </div>
    <div id="radio-unmute-hint" style="display:none;position:absolute;bottom:26%;left:50%;transform:translateX(-50%);z-index:60;background:rgba(0,0,0,0.78);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15)">&#x1f507; 点击开启声音</div>
    <audio id="radio-audio" preload="auto" style="display:none"></audio>
  </div>

  <div class="fallback" id="fallback">
    <p>播放器加载失败</p>
    <button onclick="location.reload()">刷新重试</button>
  </div>

  <div class="epg-panel" id="epg-panel">
    <div class="epg-panel-head">
      <span class="epg-panel-title" id="epg-panel-title">节目单</span>
      <button class="epg-panel-close" id="epg-panel-close" title="关闭">✕</button>
    </div>
    <div class="epg-body" id="epg-body"></div>
  </div>
</div>

<script src="/static/hls.min.js"></script>
<script src="/static/mpegts.min.js"></script>
<script>
(function(){
var isRadio = {{ is_radio | tojson }} === true || {{ is_radio | tojson }} === 'true';
var channelName = {{ channel_name | tojson }};
var streamUrl = {{ stream_url | tojson }};
var proxyUrl = {{ proxy_url | tojson }};
var channelGroup = {{ channel_group | tojson }};
var frequency = {{ frequency | tojson }};
var tvgId = {{ tvg_id | tojson }};
var tvgName = {{ tvg_name | tojson }};
var epgChannel = {{ epg_channel | tojson }};
// EPG 模块位于独立的 IIFE 中无法访问本作用域变量，显式暴露到 window 供其解构
window.__playerEpgCtx={isRadio:isRadio,channelName:channelName,epgChannel:epgChannel,tvgId:tvgId,tvgName:tvgName};
var loadingScreen = document.getElementById('loading-screen');
var typeBadge = document.getElementById('type-badge');
var videoArea = document.getElementById('video-area');
var radioView = document.getElementById('radio-view');
var fallback = document.getElementById('fallback');
setTimeout(function(){if(loadingScreen)loadingScreen.classList.add('hidden')},300);

var regionBadge=document.getElementById('region-badge');
var CN_KW=['央视','卫视','CGTN','CRI','地方','北京','上海','天津','重庆','河北','河南','山东','山西','陕西','湖北','湖南','安徽','浙江','江苏','江西','广东','广西','福建','四川','贵州','云南','辽宁','吉林','黑龙江','内蒙古','新疆','西藏','青海','甘肃','宁夏','海南','香港','澳门','台湾','深圳','广州','杭州','南京','成都','武汉','长沙','苏州'];
var isCN=false;
for(var ci=0;ci<CN_KW.length;ci++){if(channelGroup.indexOf(CN_KW[ci])>=0){isCN=true;break}}
if(channelGroup&&!isCN){

var PALETTE=[['#e74c3c','#c0392b'],['#e67e22','#d35400'],['#f1c40f','#f39c12'],['#2ecc71','#27ae60'],['#1abc9c','#16a085'],['#3498db','#2980b9'],['#9b59b6','#8e44ad'],['#e84393','#c2185b'],['#00b894','#00a381'],['#6c5ce7','#5b2ccf']];
function pickPal(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return PALETTE[Math.abs(h)%PALETTE.length]}
function firstLetter(s){if(!s)return'?';var c=s.trim()[0];return /[\u4e00-\u9fff]/.test(c)?c:c.toUpperCase()}

function waitForLib(name,timeout){
  return new Promise(function(resolve){
    if(window[name])return resolve(window[name]);
    var ci=setInterval(function(){if(window[name]){clearInterval(ci);resolve(window[name])}},150);
    setTimeout(function(){clearInterval(ci);resolve(null)},timeout||6000);
  });
}

// 2026-09-01: 支持 FLV 直连流（虎牙/斗鱼等直播源）与 HLS/原生音频区分。
// 播放前探测流类型：FLV → mpegts.js；HLS → HLS.js；原生音频流（MP3/AAC 等）→ 浏览器原生播放。
// 注意：必须定义在 if(isRadio)/else 顶层作用域——电视与电台两条播放路径都会调用它。
// 此前定义在 else（电视）分支内部，电台播放走 isRadio 分支时函数从未定义，
// 导致 "detectStreamType is not a function"（player 页面 522 行报错）。
function detectStreamType(url,cb){
  if(/\.flv(\?|$)/i.test(url)){cb({flv:true});return}
  if(/\.m3u8(\?|$)/i.test(url)){cb({flv:false});return}
  try{
    fetch(url,{headers:{'Range':'bytes=0-64'}}).then(function(r){
      var ct=(r.headers.get('content-type')||'').toLowerCase();
      var reader=r.body.getReader();
      reader.read().then(function(res){
        var u=res.value||new Uint8Array(0);
        var head='';
        for(var i=0;i<Math.min(u.length,16);i++)head+=String.fromCharCode(u[i]);
        try{reader.cancel()}catch(e){}
        // MP3 帧同步：首字节 0xFF，次字节高 5 位为 11111（0xE0 mask）
        var mp3Sync=u.length>=2&&u[0]===0xFF&&(u[1]&0xE0)===0xE0;
        // MP4 直连点播源（moov/ftyp box 开头）：此前无对应分支被错误路由到 HLS.js 导致无法播放
        cb({
          flv:head.indexOf('FLV')===0||ct.indexOf('flv')>=0,
          hls:head.indexOf('#EXTM3U')===0||ct.indexOf('mpegurl')>=0,
          native:ct.indexOf('audio/')===0||head.indexOf('ID3')===0||head.indexOf('OggS')===0||mp3Sync,
          mp4:head.indexOf('ftyp')>=0||ct.indexOf('mp4')>=0,
          html:ct.indexOf('text/html')>=0
        });
      }).catch(function(){cb({flv:false,hls:true})});
    }).catch(function(){cb({flv:false,hls:true})});
  }catch(e){cb({flv:false,hls:true})}
}

// ===== 电台自动播放兜底 =====
// Chrome/Edge 等要求用户手势才允许"带声音"的自动播放；页面通常由 window.open 新开，
// 无用户激活时 audio.play() 会以 NotAllowedError 拒绝，且不触发 playing/error 事件，
// 用户只会一直看到"加载中..."并误以为不能播放。
// 策略：带声试播 → 被拦则静音起播（浏览器允许）证明流可用 + 显示"点击开启声音"提示 →
//       用户点击后恢复声音继续播放。
function getRadioAudio(){return document.getElementById('radio-audio')}
function getRadioHint(){return document.getElementById('radio-unmute-hint')}
function getRadioVol(){return document.getElementById('vol-slider')}
function hideRadioUnmuteHint(){var h=getRadioHint();if(h)h.style.display='none'}
function showRadioUnmuteHint(){var h=getRadioHint();if(h)h.style.display='flex'}
function unmuteRadioAudio(){
  var a=getRadioAudio();
  if(!a)return;
  a.muted=false;
  var v=getRadioVol();
  a.volume=(v&&v.value?Number(v.value):80)/100;
  hideRadioUnmuteHint();
}
function requestRadioPlay(){
  var a=getRadioAudio();
  if(!a)return;
  var p=a.play();
  if(p&&p.catch){
    p.catch(function(err){
      if(err&&err.name==='NotAllowedError'){
        // 自动播放被浏览器拦截：静音起播证明流可播，并提示用户点击开启声音
        a.muted=true;
        showRadioUnmuteHint();
        var p2=a.play();
        if(p2&&p2.catch)p2.catch(function(){});
      }else{
        // 其它播放失败交由 audio error 事件统一处理（显示"播放出错"+重试）
        hideLoading();
        var ps=document.getElementById('play-status');
        if(ps){ps.textContent='播放出错';ps.classList.remove('green')}
      }
    });
  }
}

          if(lv.videoCodec)parts.push(lv.videoCodec);
          if(lv.audioCodec)parts.push(lv.audioCodec);
          if(parts.length)codecTxt=parts.join(' / ');

        }
      },2000);
    });
  });

  function startMpegtsTv(url){
    if(!window.mpegts){
      tvVideo.src=url;tvVideo.play().catch(function(){});
      hideLoading();return;
    }
    // mpegts.js 在 Web Worker 中 fetch 无法解析相对路径（/proxy?url=...），
    // 报 "Failed to parse URL"。必须传入绝对 URL，并关闭 Worker 避免该问题。
    if(/^https?:\/\//i.test(url)===false){url=location.origin+url}
    var player=mpegts.createPlayer({type:'flv',isLive:true,url:url},{enableWorker:false,liveBufferLatencyChasing:true});
    window._tvMpegts=player;
    player.attachMediaElement(tvVideo);
    player.load();
    player.play().catch(function(){});
    player.on(mpegts.Events.ERROR,function(type,detail,info){
      if(type===mpegts.ErrorTypes.NETWORK_ERROR){
        tvNetErrorCount++;
        if(tvNetErrorCount>=3){
          hideLoading();
          document.getElementById('load-error').style.display='block';
          document.getElementById('loading-ring').style.display='none';
          document.getElementById('loading-text').style.display='none';
          return;
        }
        try{player.unload();player.load()}catch(e){}
      }else if(type===mpegts.ErrorTypes.MEDIA_ERROR){
        try{player.destroy()}catch(e){}
      }
    });
    tvVideo.addEventListener('playing',function(){tvNetErrorCount=0;hideLoading()},{once:true});
    // 2026-09-01: FLV 分支也更新流信息面板（码率/编码/缓冲）。
    var lastCodecTxt='';
    player.on(mpegts.Events.MEDIA_INFO,function(media){
      try{
        if(media&&media.videoCodec){
          lastCodecTxt=media.videoCodec+(media.audioCodec?(' / '+media.audioCodec):'');
        }else if(media&&(media.width||media.height)){
          lastCodecTxt=media.width+'x'+media.height;
        }
      }catch(e){}
    });
    var emaSpeedKbps=0;
    player.on(mpegts.Events.STATISTICS_INFO,function(stat){
      try{
        // stat.speed 单位为 KB/s（下载速率），*8 得到 kbps，直播源下近似实时码率
        var kbps=(stat&&stat.speed?stat.speed:0)*8;
        emaSpeedKbps=emaSpeedKbps?(emaSpeedKbps*0.7+kbps*0.3):kbps;
      }catch(e){}
    });

      var cdEl=document.getElementById('info-codec');

        var txt=lastCodecTxt;
        if(!txt&&tvVideo.videoWidth>0&&tvVideo.videoHeight>0)txt=tvVideo.videoWidth+'x'+tvVideo.videoHeight;
        cdEl.textContent=txt||'';
      }
      var bufEl=document.getElementById('info-buffer');
      if(bufEl&&tvVideo.buffered&&tvVideo.buffered.length>0){
        var bufEnd=tvVideo.buffered.end(tvVideo.buffered.length-1);
        var bufLen=bufEnd-tvVideo.currentTime;
        bufEl.textContent=Math.round(bufLen)+'s';
      }
    },2000);
  }
  function startHlsTv(url){

      if(!HlsLib||!HlsLib.isSupported()){
        tvVideo.src=url;tvVideo.play().catch(function(){});

      var emaKbps=0;

      function refreshCodec(){
        try{
          var lvl=hls.levels[hls.currentLevel>=0?hls.currentLevel:0];
          if(!lvl)return;
          var parts=[];
          if(lvl.videoCodec)parts.push(lvl.videoCodec);
          if(lvl.audioCodec)parts.push(lvl.audioCodec);
          if(parts.length)lastCodec=parts.join(' / ');
        }catch(e){}
      }
      hls.on(HlsLib.Events.FRAG_LOADED,function(e,d){var fg=d&&d.frag;if(!fg||!fg.duration||fg.duration<=0)return;var inst=(fg.byteLength||0)*8/fg.duration/1000;emaKbps=emaKbps?(emaKbps*0.7+inst*0.3):inst});
      hls.on(HlsLib.Events.FRAG_PARSED,refreshCodec);
      hls.on(HlsLib.Events.LEVEL_UPDATED,refreshCodec);
      hls.on(HlsLib.Events.ERROR,function(e,d){
        if(d.fatal){
          if(d.type===HlsLib.ErrorTypes.NETWORK_ERROR){
            tvNetErrorCount++;
            if(tvNetErrorCount>=3){
              hideLoading();
              document.getElementById('load-error').style.display='block';
              document.getElementById('loading-ring').style.display='none';
              document.getElementById('loading-text').style.display='none';
              return;
            }
            hls.startLoad();
          }else if(d.type===HlsLib.ErrorTypes.MEDIA_ERROR){
            hls.recoverMediaError();
          }
        }
      });
      tvVideo.addEventListener('playing',function(){tvNetErrorCount=0;hideLoading()});
      setTimeout(function(){
        if(tvNetErrorCount===0&&tvVideo.paused){
          var lt=document.getElementById('loading-text');
          if(lt)lt.textContent='缓冲中，请稍候...';
        }
      },4000);
      setTimeout(function(){
        if(tvNetErrorCount===0&&tvVideo.paused){
          hideLoading();
          document.getElementById('load-error').style.display='block';
          document.getElementById('loading-ring').style.display='none';
          document.getElementById('loading-text').style.display='none';
        }
      },15000);
      setInterval(function(){
        var brEl=document.getElementById('info-bitrate');
        var cdEl=document.getElementById('info-codec');
        var lv=(hls&&hls.currentLevel>=0&&hls.levels)?hls.levels[hls.currentLevel]:null;
        var codecTxt=lastCodec;
        if(!codecTxt&&lv){
          var parts=[];
          if(lv.videoCodec)parts.push(lv.videoCodec);
          if(lv.audioCodec)parts.push(lv.audioCodec);
          if(parts.length)codecTxt=parts.join(' / ');
        }
        if(!codecTxt&&tvVideo.videoWidth>0&&tvVideo.videoHeight>0)codecTxt=tvVideo.videoWidth+'x'+tvVideo.videoHeight;
        if(cdEl)cdEl.textContent=codecTxt||'未知';
        if(lv){
          if(lv.bitrate>0&&brEl)brEl.textContent=Math.round(lv.bitrate/1000)+' kbps';
        }
        if(brEl&&(!lv||!lv.bitrate||lv.bitrate<=0)&&emaKbps>0)brEl.textContent=Math.round(emaKbps)+' kbps';
        if(tvVideo.buffered&&tvVideo.buffered.length>0){
          var bufEnd=tvVideo.buffered.end(tvVideo.buffered.length-1);
          var bufLen=bufEnd-tvVideo.currentTime;
          document.getElementById('info-buffer').textContent=Math.round(bufLen)+'s';
        }
      },2000);
    });
  }
  function playTv(url){
    if(window._tvHls){try{window._tvHls.destroy()}catch(e){}window._tvHls=null}
    if(window._tvMpegts){try{window._tvMpegts.destroy()}catch(e){}window._tvMpegts=null}
    tvNetErrorCount=0;
    document.getElementById('load-error').style.display='none';
    detectStreamType(url,function(type){
      if(type.mp4){startNativeTv(url)}
      else if(type.flv&&window.mpegts){startMpegtsTv(url)}
      else if(type.native){startNativeTv(url)}
      else if(type.html){
        // 源返回网页而非流媒体（如 Icecast 目录页/防盗链跳转页），明确报错而非一直卡加载
        hideLoading();
        var de=document.getElementById('load-error-desc');
        if(de)de.textContent='该源返回的是网页而非流媒体（可能是重定向到播放器页面），无法直接播放';
        document.getElementById('load-error').style.display='block';
        document.getElementById('loading-ring').style.display='none';
        document.getElementById('loading-text').style.display='none';
      }
      else{startHlsTv(url)}
    });
  }
  playTv(validUrl);
}
})();

(function(){
var infoBtn=document.getElementById('stream-info-btn');
var infoPanel=document.getElementById('stream-info-panel');
if(!infoBtn||!infoPanel)return;
function hideStreamInfo(){infoPanel.classList.remove('show');infoBtn.classList.remove('active')}
infoBtn.addEventListener('click',function(e){
  e.stopPropagation();
  var show=infoPanel.classList.toggle('show');
  if(show)infoBtn.classList.add('active');else infoBtn.classList.remove('active');
});
document.addEventListener('click',function(e){
  if(!infoPanel.contains(e.target)&&e.target!==infoBtn)hideStreamInfo();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')hideStreamInfo();
});
})();

(function(){
var __epgCtx=window.__playerEpgCtx||{};
var isRadio=__epgCtx.isRadio,channelName=__epgCtx.channelName,epgChannel=__epgCtx.epgChannel,tvgId=__epgCtx.tvgId,tvgName=__epgCtx.tvgName;
var epgBtn=document.getElementById('epg-btn');
var epgPanel=document.getElementById('epg-panel');
var epgBody=document.getElementById('epg-body');
var epgPanelTitle=document.getElementById('epg-panel-title');
if(!epgBtn||!epgPanel)return;
function fmtTime(x){if(!x||x.length<14)return x||'';return x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6,8)+' '+x.slice(8,10)+':'+x.slice(10,12)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var epgOpen=false;
var epgRetryCount=0;
function hideEpg(){epgOpen=false;epgRetryCount=0;epgPanel.classList.remove('open');epgBtn.classList.remove('active')}
function loadEpg(){
  epgPanel.classList.add('open');
  epgBtn.classList.add('active');
  if(isRadio){
    epgPanelTitle.textContent='节目单 · '+channelName;
    epgBody.innerHTML='<div class="epg-msg">该电台暂无节目单（EPG 暂未覆盖电台）</div>';
    return;
  }
  epgPanelTitle.textContent='节目单 · '+epgChannel;
  epgBody.innerHTML='<div class="epg-loading"><div class="epg-spin"></div>加载节目单中...</div>';
  var url='/api/epg/channel/'+encodeURIComponent(epgChannel);
  var params=[];
  if(tvgId)params.push('tvg_id='+encodeURIComponent(tvgId));
  if(tvgName&&tvgName!==epgChannel)params.push('tvg_name='+encodeURIComponent(tvgName));
  if(params.length)url+='?'+params.join('&');
  fetch(url,{cache:'no-store'}).then(function(res){
    if(!res.ok)throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(data){
    if(data&&data.loading){
      // 首次按需拉取全量 EPG 时后端立即返回，后台加载完成后自动重查
      epgBody.innerHTML='<div class="epg-msg">节目单加载中（首次需拉取全量数据，约几秒）...</div>';
      if(epgOpen&&epgRetryCount<8){epgRetryCount++;setTimeout(loadEpg,3000);return}
      epgBody.innerHTML='<div class="epg-msg">节目单加载超时，请稍后重试</div>';
      return;
    }
    epgRetryCount=0;
    var epg=data&&data.epg;
    if(!epg||!epg.programs||!epg.programs.length){
      epgBody.innerHTML='<div class="epg-msg">未匹配到该频道的节目单数据</div>';
      return;
    }
    var html='';
    if(epg.current){
      html+='<div class="epg-now"><div class="epg-now-label">正在播出</div><div class="epg-now-title">'+esc(epg.current.title)+'</div>';
      if(epg.current.desc)html+='<div class="epg-now-desc">'+esc(epg.current.desc)+'</div>';
      html+='</div>';
    }
    for(var i=0;i<epg.programs.length;i++){
      var p=epg.programs[i];
      html+='<div class="epg-item'+(p.is_current?' current':'')+'">';
      html+='<div class="epg-item-time">'+fmtTime(p.start)+' ~ '+fmtTime(p.stop);
      if(p.category)html+='<span class="epg-item-cat">'+esc(p.category)+'</span>';
      if(p.is_current)html+='<span class="epg-item-current-badge">当前</span>';
      html+='</div>';
      html+='<div class="epg-item-title">'+esc(p.title)+'</div>';
      if(p.desc)html+='<div class="epg-item-desc">'+esc(p.desc)+'</div>';
      html+='</div>';
    }
    epgBody.innerHTML=html;
  }).catch(function(){
    epgBody.innerHTML='<div class="epg-msg">节目单服务暂不可用，请稍后再试</div>';
  });
}
epgBtn.addEventListener('click',function(e){
  e.stopPropagation();
  if(epgOpen){hideEpg();return}
  epgOpen=true;
  loadEpg();
});
document.getElementById('epg-panel-close').addEventListener('click',hideEpg);
document.addEventListener('click',function(e){
  if(epgOpen&&!epgPanel.contains(e.target)&&e.target!==epgBtn)hideEpg();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&epgOpen)hideEpg();
});
})();
</script>
</body>
</html>
